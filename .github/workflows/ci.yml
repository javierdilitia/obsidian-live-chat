# Every check runs through scripts/check.py, the same file the git hooks call.
# The four job names (backend, web, secrets, commits) are the required status checks on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # StoreContract runs against this; without it TestPostgresStore is skipped.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: obsidian
          POSTGRES_PASSWORD: obsidian
          POSTGRES_DB: obsidian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obsidian -d obsidian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OBSIDIAN_TEST_DATABASE_URL: postgresql+asyncpg://obsidian:obsidian@localhost:5432/obsidian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.24"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages --directory backend
      - run: python3 scripts/check.py backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: python3 scripts/check.py web

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # from gitleaks_8.30.1_checksums.txt on the release page
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan this change's commits (uses .gitleaks.toml)
        env:
          RANGE: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$RANGE" .'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.24"
      - name: Check commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! uvx --from "conventional-pre-commit==4.5.0" conventional-pre-commit \
                feat fix docs chore refactor test ci build perf "$RUNNER_TEMP/msg.txt"; then
              echo "::error::Commit $sha does not follow Conventional Commits"
              exit 1
            fi
          done
