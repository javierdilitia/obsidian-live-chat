# Local Postgres for the agent (OBSIDIAN_DATABASE_URL) and the store tests
# (OBSIDIAN_TEST_DATABASE_URL). Start it with: docker compose up -d --wait postgres
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian
      POSTGRES_DB: obsidian
    ports:
      # Set OBSIDIAN_POSTGRES_PORT when another Postgres already uses 5432 on this machine.
      - "${OBSIDIAN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d obsidian"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
