[project]
name = "halden-agent"
version = "0.1.0"
description = "Halden agent service (FastAPI): builds and edits shop pages with the A2UI model."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "halden-data-contract",
    "halden-data-fake",
    "openai==3.49.0",
    "python-dotenv==1.2.4",
    "a2ui-agent-sdk==0.11.0",
]

[tool.uv.sources]
halden-data-contract = { workspace = true }
halden-data-fake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halden_agent"]
