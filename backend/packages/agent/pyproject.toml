[project]
name = "halden-agent"
version = "0.1.0"
description = "Halden agent service (FastAPI). Only a health endpoint for now."
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "halden-data-contract"]

[tool.uv.sources]
halden-data-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halden_agent"]
