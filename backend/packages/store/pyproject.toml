[project]
name = "obsidian-store"
version = "0.1.0"
description = "Obsidian's state: the Store protocol, MemoryStore, PostgresStore and the shared contract suite."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic>=2",
    "sqlalchemy[asyncio]==2.1.8",
]

[project.optional-dependencies]
testing = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_store"]
