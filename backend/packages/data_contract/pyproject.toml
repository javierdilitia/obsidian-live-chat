[project]
name = "halden-data-contract"
version = "0.1.0"
description = "Read-only catalog and order interface, plus the shared contract test suite."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
testing = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halden_data_contract"]
