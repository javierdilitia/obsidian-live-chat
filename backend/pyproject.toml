# uv workspace root. No [project]: each package under packages/ is its own project.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright",
    "ruff",
    "pre-commit",
    "httpx2",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Azure deployment; skipped unless OBSIDIAN_LIVE=1"]
addopts = "--import-mode=importlib --cov=obsidian_data_contract --cov=halden_data_fake --cov=obsidian_agent --cov=obsidian_store --cov-fail-under=80"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# Proven by StoreContract against a real Postgres (CI's service container); the pre-push hook
# has no database, so they stay out of the 80 % gate.
omit = ["*/obsidian_store/postgres.py", "*/obsidian_store/migrations/*"]
